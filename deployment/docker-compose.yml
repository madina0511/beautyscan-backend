name: beautyscan-ai

x-runtime: &runtime
  restart: unless-stopped
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  backend:
    <<: *runtime
    image: beautyscan-ai-backend:local
    build:
      context: ..
    env_file:
      - path: ${BACKEND_ENV_FILE:?Set an absolute private backend env file path}
        format: raw
    environment:
      NODE_ENV: production
      PORT: '3000'
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google_service_account
    secrets: [google_service_account]
    ports: ['127.0.0.1:3101:3000']
    volumes: [uploads:/app/uploads]
    networks: [backend]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/graphql',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:'{ getHello }'}),signal:AbortSignal.timeout(4000)}).then(async r=>{const b=await r.json();if(!r.ok||typeof b.data?.getHello!=='string')process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  frontend:
    <<: *runtime
    image: beautyscan-ai-frontend:local
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_GRAPHQL_URL: ${NEXT_PUBLIC_GRAPHQL_URL:?Set the public HTTPS API GraphQL URL}
        NEXT_PUBLIC_USD_TO_UZS: ${NEXT_PUBLIC_USD_TO_UZS:-}
        NEXT_PUBLIC_USD_TO_KRW: ${NEXT_PUBLIC_USD_TO_KRW:-}
    ports: ['127.0.0.1:3100:3001']
    networks: [frontend]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/',{signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

networks:
  frontend:
  backend:

volumes:
  uploads:

secrets:
  google_service_account:
    file: ${GOOGLE_SERVICE_ACCOUNT_FILE:?Set an absolute private credential file path}
